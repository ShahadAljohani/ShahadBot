<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shahad's Chatbot</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #09435c;
      align-items: center;
    }

    h1 {
      margin: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    #chat-container {
      flex: 1 1 auto;
      width: 100%;
      max-width: 600px;
      height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;   /* messages start from top */
      padding: 20px;
      overflow-y: auto;              /* scroll enabled */
      border-radius: 12px;
      margin-bottom: 10px;
      box-sizing: border-box;
      scroll-behavior: smooth;

      /* Firefox scrollbar */
      scrollbar-width: thin;
      scrollbar-color: #316f8a #34657ae1;
    }

    /* WebKit browsers (Chrome, Safari, Edge) */
    #chat-container::-webkit-scrollbar {
      width: 12px;
    }
    #chat-container::-webkit-scrollbar-track {
      background-color: #316f8a;
      border-radius: 10px;
    }
    #chat-container::-webkit-scrollbar-thumb {
      background: linear-gradient(#316f8a, #08506f);
      border-radius: 10px;
    }
    #chat-container::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(#316f8a, #0a5d81);
    }

    .message {
      flex-shrink: 0;
      margin: 8px 0;
      padding: 10px 15px;
      border-radius: 15px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .user {
      background: #0a5d81;
      color: white;
      align-self: flex-end;
    }

    .bot {
      background: #f1f1f1;
      color: black;
      align-self: flex-start;
    }

    #robot {
      width: 140px;
      cursor: pointer;
      margin-bottom: 27px;
      transition: transform 0.2s ease;
    }
    #robot:hover {
      transform: scale(1.1);
    }

    .robot-float {
      width: 200px;
      animation: float 5s ease-in-out infinite;
      margin-top: 10px;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0); }
    }

    #input-box {
      display: flex;
      width: 100%;
      max-width: 600px;
      border: 1px solid #ddd;
      border-radius: 25px;
      padding: 8px 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    #message-input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 16px;
    }

    #send-btn {
      background: #0a5d81;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 18px;
      margin-left: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }
    #send-btn:hover {
      background: #08506f;
    }
  </style>
</head>
<body>
  <h1>Shahad's Chatbot</h1>

  <div id="chat-container"></div>
   
  <img src="webRobot.png" alt="Floating robot" id="robot" class="robot-float">

  <div id="input-box">
    <input type="text" id="message-input" placeholder="Ask me anything...">
    <button id="send-btn">➤</button>
  </div>

  <script>
  const messagesDiv = document.getElementById("chat-container");
  const userInput = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");
  const robot = document.getElementById("robot");

  // ✅ Add message to chat
  function addMessage(sender, text) {
    const msg = document.createElement("div");
    msg.classList.add("message", sender === "You" ? "user" : "bot");
    msg.textContent = text;
    messagesDiv.appendChild(msg);
    scrollToBottom();
  }

  // ✅ Auto-scroll helper
  function scrollToBottom() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // ✅ Send message to Flask backend
  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage("You", text);
    userInput.value = "";

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();

      // Bot typing effect
      if (data.reply) {
        const msg = document.createElement("div");
        msg.classList.add("message", "bot");
        messagesDiv.appendChild(msg);

        let i = 0;
        function typeWriter() {
          if (i < data.reply.length) {
            msg.textContent += data.reply.charAt(i);
            scrollToBottom();
            i++;
            setTimeout(typeWriter, 30);
          }
        }
        typeWriter();
      }

      // Play audio if available
      if (data.audio_url) {
        const audio = new Audio(data.audio_url);
        audio.play();
      }

    } catch (err) {
      console.error("Error sending message:", err);
      addMessage("Bot", "Oops! Something went wrong.");
    }
  }

  // Send when clicking button or pressing Enter
  sendBtn.addEventListener("click", sendMessage);
  userInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // 🎤 Voice recognition when robot is pressed
  robot.addEventListener("click", () => {
    if (!('webkitSpeechRecognition' in window)) {
      alert("Your browser doesn't support speech recognition.");
      return;
    }

    const recognition = new webkitSpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onresult = (event) => {
      let interimTranscript = "";
      let finalTranscript = "";

      for (let i = event.resultIndex; i < event.results.length; ++i) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalTranscript += transcript;
        } else {
          interimTranscript += transcript;
        }
      }

      userInput.value = finalTranscript + interimTranscript;
    };

    recognition.onend = () => {
      if (userInput.value.trim()) {
        sendMessage();
      }
    };

    recognition.start();
  });
  </script>
</body>
</html>
